# Link checking for site-docs/ (docs-check.yml, docs-links.yml), as in mcp-js.

# lychee ≥0.24 replaced the boolean with a mode string; "full" checks both
# anchor fragments and text fragments (the old `true` checked anchors).
include_fragments = "full"
max_retries = 3
retry_wait_time = 2
timeout = 20
verbose = "info"

exclude = [
  "^http://localhost(:[0-9]+)?(/|$)",
  "^http://127\\.0\\.0\\.1(:[0-9]+)?(/|$)",
  # This site's own absolute URLs (the browser demo under /demo/, pages linked by full URL): they only exist once
  # the build being checked is deployed. scripts/check_docs_browser.py checks them in the built site instead.
  "^https://r33drichards\\.github\\.io/laya-vision(/|$)",
]
