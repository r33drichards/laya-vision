name: Docs Check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build docs package
        run: nix build .#packages.x86_64-linux.docs --print-build-logs -L
      - name: Point this repo's blob/main links at the commit under test
        # Docs link code by https://github.com/<repo>/blob/main/... (MkDocs cannot link outside site-docs/), so a
        # change that adds a file and documents it would fail the check until it is merged. Check those links at
        # the commit being tested instead.
        env:
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf "\nremap = ['^https://github\\.com/%s/(blob|tree)/main/ https://github.com/%s/\$1/%s/']\n" \
            "${REPO//./\\.}" "$HEAD_REPO" "$SHA" >> .lychee.toml
          tail -1 .lychee.toml
      - name: Check docs links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml site-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run docs browser test
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python3 scripts/check_docs_browser.py result
