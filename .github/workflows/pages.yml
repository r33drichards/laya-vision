# Publish the browser demo (web-demo/) to GitHub Pages. Only the static page is deployed; the ONNX files are too big
# for Pages (100 MB per file) and load from the Hub copy at thaitea/laya-vision-web, written by
# `modal run modal_app.py::publish_web`. Needs Settings -> Pages -> Source set to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["web-demo/*.html", "web-demo/*.js", "web-demo/*.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the page (the tests and their fixtures stay behind)
        run: |
          mkdir -p _site
          cp web-demo/index.html web-demo/app.js web-demo/worker.js web-demo/laya.js web-demo/style.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
