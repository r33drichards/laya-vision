<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="15" role="img" aria-label="Before: Laya takes text and a question, runs ModernBERT, and returns typed answers. After: Laya Vision takes an image, text and a question, runs SmolVLM, and returns the same typed answers.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fff"/>

  <!-- Before -->
  <text x="30" y="46" font-size="13" font-weight="bold" fill="#5b6f9e" letter-spacing="1.5">BEFORE · Laya</text>
  <rect x="30" y="62" width="180" height="60" rx="8" fill="#fff" stroke="#999"/>
  <text x="120" y="89" text-anchor="middle" fill="#333">text</text>
  <text x="120" y="109" text-anchor="middle" fill="#333">+ question</text>
  <line x1="210" y1="92" x2="268" y2="92" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <rect x="272" y="62" width="200" height="60" rx="8" fill="#5b6f9e"/>
  <text x="372" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">ModernBERT</text>
  <line x1="472" y1="92" x2="530" y2="92" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <!-- After -->
  <text x="30" y="176" font-size="13" font-weight="bold" fill="#4c8a4c" letter-spacing="1.5">AFTER · Laya Vision</text>
  <rect x="30" y="192" width="180" height="60" rx="8" fill="#fff" stroke="#999"/>
  <text x="120" y="219" text-anchor="middle" fill="#333"><tspan font-weight="bold">image</tspan> + text</text>
  <text x="120" y="239" text-anchor="middle" fill="#333">+ question</text>
  <line x1="210" y1="222" x2="268" y2="222" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <rect x="272" y="192" width="200" height="60" rx="8" fill="#4c8a4c"/>
  <text x="372" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">SmolVLM</text>
  <line x1="472" y1="222" x2="530" y2="222" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <!-- Shared output -->
  <rect x="534" y="62" width="196" height="190" rx="8" fill="#fafafa" stroke="#bbb" stroke-dasharray="6 4"/>
  <text x="632" y="120" text-anchor="middle" font-weight="bold" fill="#333">same typed answers</text>
  <text x="632" y="150" text-anchor="middle" fill="#555">choice · score · noul</text>
  <text x="632" y="174" text-anchor="middle" fill="#555">calibrated probabilities</text>
  <text x="632" y="198" text-anchor="middle" fill="#555">one forward pass</text>
</svg>
