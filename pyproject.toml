[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya"
version = "0.2.0.dev0"
description = "Laya Vision: calibrated typed decisions over images (SmolVLM or ModernVBERT backbone), a fork of Laya"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# the HTTP API (laya-serve); laya.client itself needs only requests
serve = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "requests>=2.25",
]

[project.scripts]
laya-serve = "laya.server:main"

[project.urls]
Homepage = "https://github.com/r33drichards/laya-vision"
Model = "https://huggingface.co/thaitea/laya-vision-smolvlm-256m"
Demo = "https://huggingface.co/spaces/thaitea/laya-vision-demo"

[tool.setuptools.packages.find]
include = ["laya*"]
